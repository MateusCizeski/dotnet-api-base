name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ApiBase.Core.sln

      - name: Build
        run: dotnet build ApiBase.Core.sln -c Release --no-restore

      - name: Test
        run: dotnet test ApiBase.Core.sln -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Vulnerable packages
        run: dotnet list ApiBase.Core.sln package --vulnerable --include-transitive
