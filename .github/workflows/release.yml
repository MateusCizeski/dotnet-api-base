name: Release

# Publishes the 5 packages to nuget.org when a version tag is pushed: git tag v3.0.0 && git push origin v3.0.0
# Uses nuget.org Trusted Publishing (OIDC): no long-lived API key stored in the repository.
# Setup (once): nuget.org > Trusted Publishing > add a policy for this repository and the file release.yml,
# then create the repository secret NUGET_USER with your nuget.org profile name.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required to request the OIDC token used by NuGet/login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build ApiBase.Core.sln -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test ApiBase.Core.sln -c Release --no-build

      - name: Pack
        run: |
          for project in ApiBase.Domain ApiBase.Infra ApiBase.Repository ApiBase.Application ApiBase.Controller; do
            dotnet pack "$project/$project.csproj" -c Release --no-build -p:Version=$VERSION -o ./nupkgs
          done

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
